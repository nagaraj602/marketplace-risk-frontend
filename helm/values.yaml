frontend:
  name: marketplace-risk-frontend
  replicaCount: 2
  image:
    repository: __FRONTEND_IMAGE_REPOSITORY__
    tag: __FRONTEND_IMAGE_TAG__
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  env:
    PORT: "3000"
    BACKEND_URL: "http://marketplace-risk-backend:8080"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /health
      port: 3000
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      path: /health
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
